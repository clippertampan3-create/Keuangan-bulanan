<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f15b7a">
<link rel="manifest" href="manifest.json">
<title>Keuangan Bulanan</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#fff5f7;color:#222}
.container{max-width:520px;margin:auto;padding:14px}
.header{background:linear-gradient(135deg,#f15b7a,#ff8fa5);color:#fff;padding:20px;border-radius:24px;margin-bottom:14px}
.header h1{margin:0 0 5px;font-size:25px}.header p{margin:0;opacity:.9}
.balance{font-size:30px;font-weight:800;margin-top:8px}
.card{background:#fff;padding:17px;border-radius:20px;margin-bottom:14px;box-shadow:0 5px 20px #0000000d}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{padding:14px;border-radius:16px;background:#fff7f9}.stat small{color:#777}.stat strong{display:block;margin-top:6px;font-size:17px}
.green{color:#16a34a}.red{color:#dc2626}
input,select,button{width:100%;padding:13px;margin-top:8px;border-radius:12px;border:1px solid #ddd;font-size:15px}
button{border:0;background:#f15b7a;color:white;font-weight:bold}
.transaction{display:flex;align-items:center;gap:8px;padding:13px 0;border-bottom:1px solid #eee}
.transaction:last-child{border-bottom:0}.transaction-info{flex:1}.transaction-title{font-weight:bold}
.transaction-date{font-size:12px;color:#888;margin-top:3px}.transaction-amount{font-weight:bold}
.delete{width:auto;padding:7px 10px;margin:0;background:#fee2e2;color:#dc2626}
.category-row{margin-bottom:13px}.category-name{display:flex;justify-content:space-between;margin-bottom:5px}
.progress{height:9px;background:#eee;border-radius:10px;overflow:hidden}.progress-bar{height:100%;background:#f15b7a;border-radius:10px}
.empty{text-align:center;color:#888;padding:20px}.reset{background:#6b7280}
.month{margin-top:12px;font-weight:bold}footer{text-align:center;color:#888;font-size:12px;padding:10px}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>💰 Keuangan Bulanan</h1>
    <p id="currentMonth"></p>
    <div class="month">Saldo Saat Ini<div class="balance" id="balance">Rp0</div></div>
  </div>

  <div class="card">
    <div class="stats">
      <div class="stat"><small>💚 Pemasukan</small><strong class="green" id="income">Rp0</strong></div>
      <div class="stat"><small>❤️ Pengeluaran</small><strong class="red" id="expense">Rp0</strong></div>
    </div>
  </div>

  <div class="card">
    <h3>➕ Tambah Transaksi</h3>
    <select id="type">
      <option value="expense">Pengeluaran</option>
      <option value="income">Pemasukan</option>
    </select>
    <input id="description" placeholder="Contoh: Makan, gaji, bensin...">
    <input id="amount" type="number" inputmode="numeric" placeholder="Jumlah uang">
    <select id="category">
      <option>🍜 Makanan</option><option>🛵 Transportasi</option><option>🛒 Kebutuhan</option>
      <option>💡 Tagihan</option><option>🎮 Hiburan</option><option>🛍️ Belanja</option>
      <option>🏦 Tabungan</option><option>📦 Lainnya</option>
    </select>
    <input id="date" type="date">
    <button id="addButton" onclick="addTransaction()">Tambahkan Pengeluaran</button>
  </div>

  <div class="card"><h3>📊 Pengeluaran per Kategori</h3><div id="categories"></div></div>
  <div class="card"><h3>📋 Riwayat Transaksi</h3><div id="transactions"></div></div>
  <div class="card"><button class="reset" onclick="resetData()">🗑️ Hapus Semua Data</button></div>
  <footer>Data tersimpan di perangkat kamu.</footer>
</div>

<script>
let transactions=JSON.parse(localStorage.getItem("keuanganBulanan"))||[];
const today=new Date();
date.value=today.toISOString().split("T")[0];

function rupiah(n){return new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(n)}
function currentMonth(t){let d=new Date(t.date);return d.getMonth()===today.getMonth()&&d.getFullYear()===today.getFullYear()}
function save(){localStorage.setItem("keuanganBulanan",JSON.stringify(transactions))}
function addTransaction(){
  let type=document.getElementById("type").value, desc=document.getElementById("description").value.trim(),
      amount=Number(document.getElementById("amount").value), cat=document.getElementById("category").value,
      d=document.getElementById("date").value;
  if(!desc||amount<=0||!d){alert("Lengkapi data terlebih dahulu.");return}
  transactions.push({id:Date.now(),type,description:desc,amount,category:cat,date:d});
  save();description.value="";amount.value="";render();
}
function del(id){transactions=transactions.filter(t=>t.id!==id);save();render()}
function render(){
  let data=transactions.filter(currentMonth), inc=0, exp=0;
  data.forEach(t=>t.type==="income"?inc+=t.amount:exp+=t.amount);
  income.textContent=rupiah(inc);expense.textContent=rupiah(exp);balance.textContent=rupiah(inc-exp);
  transactionsBox(data);categoriesBox(data);
}
function transactionsBox(data){
  let box=document.getElementById("transactions");box.innerHTML="";
  data.sort((a,b)=>new Date(b.date)-new Date(a.date));
  if(!data.length){box.innerHTML='<div class="empty">Belum ada transaksi bulan ini.</div>';return}
  data.forEach(t=>{
    let row=document.createElement("div");row.className="transaction";
    row.innerHTML=`<div class="transaction-info"><div class="transaction-title">${esc(t.description)}</div>
    <div class="transaction-date">${esc(t.category)} • ${t.date}</div></div>
    <div class="transaction-amount ${t.type==="income"?"green":"red"}">${t.type==="income"?"+":"-"}${rupiah(t.amount)}</div>
    <button class="delete" onclick="del(${t.id})">✕</button>`;
    box.appendChild(row);
  });
}
function categoriesBox(data){
  let box=document.getElementById("categories");box.innerHTML="";
  let totals={}, total=data.filter(t=>t.type==="expense").reduce((s,t)=>s+t.amount,0);
  data.filter(t=>t.type==="expense").forEach(t=>totals[t.category]=(totals[t.category]||0)+t.amount);
  if(!total){box.innerHTML='<div class="empty">Belum ada pengeluaran.</div>';return}
  Object.entries(totals).sort((a,b)=>b[1]-a[1]).forEach(([cat,val])=>{
    let p=val/total*100,row=document.createElement("div");row.className="category-row";
    row.innerHTML=`<div class="category-name"><span>${esc(cat)}</span><strong>${rupiah(val)}</strong></div>
    <div class="progress"><div class="progress-bar" style="width:${p}%"></div></div>`;
    box.appendChild(row);
  });
}
function esc(s){let d=document.createElement("div");d.textContent=s;return d.innerHTML}
function resetData(){if(confirm("Hapus semua transaksi?")){transactions=[];save();render()}}
const months=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
currentMonth.textContent=months[today.getMonth()]+" "+today.getFullYear();
type.addEventListener("change",()=>addButton.textContent=type.value==="income"?"Tambahkan Pemasukan":"Tambahkan Pengeluaran");
if("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));
render();
</script>
</body>
</html>
